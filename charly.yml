charly-build:
    candy:
        description: |-
            Concept candy owning the charly-build authoring skills (build/generate/list/validate/migrate/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the build concept candy's skill entities are present and generated into the marketplace's build/skills
              id: charly-build-present
              context:
                - build
              command: "true"

build-skill:
    skill:
        name: build
        family: build
        owner: charly-build
        triggers:
            - "`charly box build` / `charly box generate` / Containerfile"
charly-mcp-cmd-skill:
    skill:
        name: charly-mcp-cmd
        family: build
        owner: charly-build
docs-skill:
    skill:
        name: docs
        family: build
        owner: charly-build
        triggers:
            - "`charly docs` / the opencharly.ai site / the opencharly/docs repo / Starlight/Astro / `candy/plugin-docs` (runtime plugin) or `candy/docs-site`"
generate-skill:
