charly-build:
    candy:
        description: |-
            Drained concept candy — kept only so this repo still validates as a project while it awaits
            retirement (opencharly/opencharly#611). It owns NO `skill:` entity any more: under AGENTS.md
            Part II #5 the fifteen `build` family skills moved to the repositories that hold the verbs they
            document — the ten `charly box` verbs to `plugin-box`, and `migrate` / `docs` / `secrets` /
            `settings` / `charly-mcp-cmd` to `plugin-migrate` / `plugin-docs` / `plugin-secrets` /
            `plugin-settings` / `plugin-mcp`. Nothing is authored here now.
        plan:
            - run: this documentation-only candy ships no install content (it carried the family's skill entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: this drained candy declares no skill node — every build-family skill lives in the repo that holds the verb it documents
              id: charly-build-drained
              context:
                - build
              command: "true"
